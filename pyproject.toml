[project]
name = "uptime-kuma-report"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "click~=8.1.8",
    "jinja2~=3.1.5",
    "lxml~=5.3.0",
    "markupsafe~=3.0.2",
    "matplotlib>=3.9.4",
    "numpy<2.1",
    "packaging~=24.2",
    "pandas~=2.2.3",
    "plotly~=5.24.1",
    "python-dateutil~=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "pytz~=2024.2",
    "requests>=2.32.5",
    "six~=1.17.0",
    "tenacity~=9.0.0",
    "typing-extensions~=4.12.2",
    "tzdata~=2025.1",
    "weasyprint<52",
]

[project.scripts]
kuma-uptime-report = "kuma_uptime_report.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuma_uptime_report"]
